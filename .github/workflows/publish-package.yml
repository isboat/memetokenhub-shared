name: Build and Publish to GitHub Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: publish-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate package version
        id: version
        shell: bash
        run: |
          project_version="$(dotnet msbuild src/MemeTokenHub.Shared/MemeTokenHub.Shared.csproj -getProperty:Version -nologo)"
          version_prefix="$(cut -d. -f1-2 <<< "$project_version")"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            package_version="${version_prefix}.${{ github.run_number }}"
          else
            package_version="${version_prefix}.${{ github.run_number }}-preview"
          fi

          echo "value=$package_version" >> "$GITHUB_OUTPUT"
          echo "Generated package version: $package_version"

      - name: Restore dependencies
        run: dotnet restore MemeTokenHub.Shared.sln --configfile NuGet.config

      - name: Build
        run: >-
          dotnet build MemeTokenHub.Shared.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack NuGet package
        run: >-
          dotnet pack src/MemeTokenHub.Shared/MemeTokenHub.Shared.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore MemeTokenHub.Shared.sln --configfile NuGet.config

      - name: Run unit tests
        run: >-
          dotnet test MemeTokenHub.Shared.sln
          --configuration Release
          --no-restore
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    permissions:
      contents: write
      packages: write
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts/

      - name: Validate package credentials
        shell: bash
        run: |
          if [[ -z "$NUGET_AUTH_TOKEN" ]]; then
            echo "Configure the PACKAGES_TOKEN repository secret with a classic PAT that has write:packages scope." >&2
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_AUTH_TOKEN"
          --source github
          --configfile NuGet.config
          --skip-duplicate

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.*nupkg
          tag_name: v${{ needs.build.outputs.package-version }}
          name: v${{ needs.build.outputs.package-version }}
          generate_release_notes: true
          body: |
            ## MemeTokenHub.Shared package release

            Version: ${{ needs.build.outputs.package-version }}

            Built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
        env:
          GITHUB_TOKEN: ${{ github.token }}
