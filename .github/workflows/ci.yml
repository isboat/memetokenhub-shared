name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MemeTokenHub.Shared.sln

      - name: Verify formatting
        run: dotnet format MemeTokenHub.Shared.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MemeTokenHub.Shared.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MemeTokenHub.Shared.sln --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack src/MemeTokenHub.Shared/MemeTokenHub.Shared.csproj
          --configuration Release
          --no-build
          --output artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeTokenHub.Shared
          path: artifacts/*.nupkg
          if-no-files-found: error
